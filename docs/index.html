<title>点心ならべ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Layout: a teahouse table seen from above. Ten towers of bamboo steamers, with a serving tray along the top. */
  :root {
    --table: #17443d;
    --table-deep: #10332e;
    --lane: #1f564d;
    --tray: #2a665b;
    --tray-used: #8f3a2c;
    --steam: #f6ecd6;
    --steam-dim: #b7cdbf;
    --gold: #f2bf4b;
    --mint: #8fe3c2;
    --lacquer: #a8392a;
    --display: "Kaisei Tokumin", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    --cw: 33px;
    --ch: 36px;
    --gap: 3px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--table);
    color: var(--steam);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .app {
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-block: 8px;
    position: relative;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font: 700 22px/1.2 var(--display); letter-spacing: .08em; white-space: nowrap; }
  .stats { display: flex; gap: 12px; font-size: 13px; color: var(--steam-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stats b { color: var(--steam); font-size: 16px; }
  .stats .main b { color: var(--gold); }
  .row { display: grid; grid-template-columns: repeat(10, var(--cw)); gap: var(--gap); justify-content: center; }
  .slot, .col {
    appearance: none; border: 0; padding: 0; cursor: pointer; background: var(--lane);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .slots { grid-template-columns: repeat(5, 1fr); }
  .slot { height: 44px; background: var(--tray); transition: background .2s; }
  .slot .tile { height: 38px; }
  @media (min-width: 560px) { .slots { grid-template-columns: repeat(10, var(--cw)); } }
  .slot.used { background: var(--tray-used); }
  .slot .num { position: absolute; left: 3px; top: 1px; font-size: 9px; opacity: .7; font-variant-numeric: tabular-nums; }
  .slot.has .num { display: none; }
  .status { min-height: 18px; font-size: 13px; line-height: 18px; color: var(--steam-dim); text-align: center; }
  .board { flex: 1 1 auto; min-height: 0; align-content: start; position: relative; }
  .col { flex-direction: column-reverse; justify-content: flex-start; height: calc(var(--ch) * 12); }
  .tile { width: 100%; height: var(--ch); display: flex; align-items: center; justify-content: center; flex: none; transition: transform .12s ease-out; }
  .tile svg { height: 100%; width: 100%; display: block; filter: drop-shadow(0 1px 0 rgba(0,0,0,.45)); }
  .tile.lifted { transform: translateY(-3px); }
  .tile.lifted svg { filter: drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 3px var(--gold)); }
  .tile.open svg { animation: lift-lid .32s ease-out; }
  @keyframes lift-lid { from { transform: scale(.72) rotate(-10deg); opacity: .4; } to { transform: none; opacity: 1; } }
  .spot {
    width: calc(100% - 4px); height: calc(var(--ch) - 4px); margin: 2px; flex: none;
    border: 2px dashed var(--mint); border-radius: 50%;
  }
  .slot .spot { position: absolute; height: calc(100% - 4px); border-radius: 8px; }
  .bar { display: flex; gap: 8px; justify-content: center; }
  .bar button {
    appearance: none; cursor: pointer; flex: 1 1 0; max-width: 170px; min-height: 42px; padding: 0 10px;
    border: 1px solid var(--tray); border-radius: 10px; background: var(--table-deep); font-size: 14px; font-weight: 700;
  }
  .bar button.primary { background: var(--lacquer); border-color: var(--lacquer); }
  .sheet {
    position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    background: rgba(9, 28, 25, .78);
  }
  .card {
    width: min(100%, 420px); max-height: 100%; overflow-y: auto; background: var(--steam); color: #33271a;
    border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .card h2 { margin: 0; font: 700 22px/1.3 var(--display); text-wrap: balance; }
  .card p { margin: 0; font-size: 14px; line-height: 1.65; }
  .card ul { margin: 0; padding-left: 1.2em; font-size: 14px; line-height: 1.65; }
  .card .bar button { color: var(--steam); }
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 6px; font-size: 11px; }
  .menu span { display: flex; align-items: center; gap: 4px; }
  .menu svg { width: 26px; height: 26px; flex: none; }
  @media (prefers-reduced-motion: reduce) {
    .tile, .slot { transition: none; }
    .tile.open svg { animation: none; }
  }
</style>

<div class="app" id="app">

    </div>
  </header>
  <div class="row slots" id="slots" role="group" aria-label="お盆"></div>

<script id="logic">
  const KINDS = ["小籠包", "焼き餃子", "桃まん", "胡麻団子", "エッグタルト", "春巻き", "焼売", "杏仁豆腐", "ちまき"];
  const COLS = 10;   // 1 列は最初から空
  const CAP = 12;
  const SLOTS = 10;
  const HINTS = 12;  // 最初からふたが開いている蒸籠の数

  function mulberry32(a) {
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(list, rng) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  // columns[c] は下から上の順。各カードは [種類, 表か]
  function deal(seed) {
    const rng = mulberry32(seed);
    const tiles = [];
    KINDS.forEach((_, k) => { for (let n = 0; n < CAP; n++) tiles.push(k); });
    shuffle(tiles, rng);
    const columns = [];
    for (let c = 0; c < COLS; c++) {
      columns.push(tiles.slice(c * CAP, (c + 1) * CAP).map(k => [k, false]));
    }
    const spots = [];
    for (let c = 0; c < KINDS.length; c++) for (let r = 0; r < CAP - 1; r++) spots.push([c, r]);
    shuffle(spots, rng).slice(0, HINTS).forEach(([c, r]) => { columns[c][r][1] = true; });
    columns.slice(0, KINDS.length).forEach(col => { col[col.length - 1][1] = true; });
    return { seed, columns, slots: Array(SLOTS).fill(null), used: Array(SLOTS).fill(false), moves: 0, uses: 0, scored: false };
  }

  // 場所は { col: i } か { slot: i } で表す
  const same = (a, b) => !!a && !!b && a.col === b.col && a.slot === b.slot;
  const allSpots = () => [
    ...Array.from({ length: COLS }, (_, col) => ({ col })),
    ...Array.from({ length: SLOTS }, (_, slot) => ({ slot })),
  ];

  function topOf(g, src) {
    if (src.col === undefined) return g.slots[src.slot];
    const col = g.columns[src.col];
    return col.length ? col[col.length - 1][0] : null;
  }

  // 上から続く、表向きで同じ種類のカードの枚数
  function runLength(g, i) {
    const col = g.columns[i];
    let n = 0;
    while (n < col.length && col[col.length - 1 - n][1] && col[col.length - 1 - n][0] === col[col.length - 1][0]) n++;
    return n;
  }

  function canMove(g, src, dst) {
    const tile = topOf(g, src);
    if (tile === null || same(src, dst)) return false;
    if (dst.col === undefined) return src.col !== undefined && g.slots[dst.slot] === null;
    const col = g.columns[dst.col];
    return !col.length || (col.length < CAP && col[col.length - 1][0] === tile);
  }

  // そろった列を空の列へ移すのは意味がないので、手として数えない
  function pointless(g, src, dst) {
    if (src.col === undefined || dst.col === undefined || g.columns[dst.col].length) return false;
    const col = g.columns[src.col];
    return col.every(t => t[0] === col[0][0]);
  }

  function solved(g) {
    return g.slots.every(s => s === null) &&
      g.columns.every(col => !col.length || (col.length === CAP && col.every(t => t[0] === col[0][0])));
  }

  function stuck(g) {
    if (solved(g)) return false;
    const spots = allSpots();
    return !spots.some(s => spots.some(d => canMove(g, s, d) && !pointless(g, s, d)));
  }

  // 動かせたら true。列から列へは、つながった同じカードを入るだけまとめて動かす
  function move(g, src, dst) {
    if (!canMove(g, src, dst)) return false;
    let count = 1;
    let tile;
    if (src.col !== undefined) {
      const col = g.columns[src.col];
      if (dst.col !== undefined) count = Math.min(runLength(g, src.col), CAP - g.columns[dst.col].length);
      tile = col[col.length - 1][0];
      col.length -= count;
      if (col.length) col[col.length - 1][1] = true;
    } else {
      tile = g.slots[src.slot];
      g.slots[src.slot] = null;
    }
    if (dst.col !== undefined) {
      for (let n = 0; n < count; n++) g.columns[dst.col].push([tile, true]);
    } else {
      g.slots[dst.slot] = tile;
      g.used[dst.slot] = true;
      g.uses++;
    }
    g.moves++;
    return true;
  }
</script>

<script>
  const $ = id => document.getElementById(id);
  const SAVE_KEY = "tenshin-narabe";
  let game, best = null, selected = null, opened = null;

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ game, best })); } catch (e) { /* 保存できなくても遊べる */ }
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
  }
  const newSeed = () => Math.floor(Math.random() * 1e9);
  const picture = kind => `<svg role="img" aria-label="${kind === null ? "ふた" : KINDS[kind]}"><use href="#${kind === null ? "lid" : "d" + kind}"/></svg>`;

  function fit() {
    const board = $("board");
    const width = board.clientWidth;
    const cw = Math.min((width - 9 * 3) / COLS, 60);
    const ch = Math.max(20, Math.min(board.clientHeight / CAP, cw * 1.25));
    document.documentElement.style.setProperty("--cw", cw + "px");
    document.documentElement.style.setProperty("--ch", ch + "px");
  }

  function render() {
    const valid = selected ? allSpots().filter(t => canMove(game, selected, t)) : [];
    const isValid = s => valid.some(t => same(t, s));

    $("slots").innerHTML = game.slots.map((tile, i) => {
      const spot = { slot: i };
      const lifted = same(selected, spot) ? " lifted" : "";
      const label = tile === null ? `お盆 ${i + 1} 空き` : `お盆 ${i + 1} ${KINDS[tile]}`;
      return `<button type="button" class="slot${game.used[i] ? " used" : ""}${tile === null ? "" : " has"}" data-slot="${i}" aria-label="${label}">
        <span class="num">${i + 1}</span>
        ${tile === null ? (isValid(spot) ? '<span class="spot"></span>' : "") : `<span class="tile${lifted}">${picture(tile)}</span>`}
      </button>`;
    }).join("");

    $("board").innerHTML = game.columns.map((col, i) => {
      const spot = { col: i };
      const lifted = same(selected, spot) ? runLength(game, i) : 0;
      const tiles = col.map(([kind, up], r) => {
        const cls = (r >= col.length - lifted ? " lifted" : "") + (opened === i && r === col.length - 1 ? " open" : "");
        return `<span class="tile${cls}">${picture(up ? kind : null)}</span>`;
      }).join("");
      const topName = col.length ? KINDS[col[col.length - 1][0]] : "空き";
      return `<button type="button" class="col" data-col="${i}" aria-label="${i + 1} 列目 ${col.length} 枚 一番上は${topName}">
        ${tiles}${isValid(spot) ? '<span class="spot"></span>' : ""}
      </button>`;
    }).join("");
    opened = null;

    $("uses").textContent = game.uses;
    $("moves").textContent = game.moves;
    $("best").textContent = best === null ? "–" : best;

    if (selected) {
      const name = KINDS[topOf(game, selected)];
      const n = selected.col !== undefined ? runLength(game, selected.col) : 1;
      $("status").textContent = `${name}${n > 1 ? ` ${n} 枚` : ""}の置き先を選んでください`;
    } else {
      $("status").textContent = "動かす点心をタップ";
    }

    if (solved(game)) {
      showResult(`完成！ お盆 ${game.uses} 回`, `手数は ${game.moves} です。お盆を使う回数が少ないほど上手です。`);
    } else if (stuck(game)) {
      showResult("動かせる点心がなくなりました", "やり直すか、新しい配置で遊んでください。");
    }
  }

  function showSheet(html) {
    $("sheet").innerHTML = `<div class="card">${html}</div>`;
    $("sheet").hidden = false;
  }
  function hideSheet() { $("sheet").hidden = true; }

  function showResult(title, text) {
    showSheet(`<h2>${title}</h2><p>${text}</p>
      <div class="bar"><button type="button" class="primary" data-act="fresh">新しい配置</button><button type="button" data-act="restart">やり直す</button></div>`);
  }

  function showRules() {
    const menu = KINDS.map((name, k) => `<span>${picture(k)}${name}</span>`).join("");
    showSheet(`<h2>遊び方</h2>
      <ul>
        <li>同じ点心を 1 列に 12 個そろえると完成です。</li>
        <li>動かせるのは一番上の点心です。ふたは、上の蒸籠をどかすと開きます。</li>
        <li>置けるのは、空の列か、一番上が同じ点心の列です。つながった同じ点心はまとめて動きます。</li>
        <li>お盆にはいつでも 1 個ずつ置けます。使う回数が少ないほど上手です。一度使ったお盆は赤くなります。</li>
      </ul>
      <div class="menu">${menu}</div>
      <div class="bar"><button type="button" class="primary" data-act="close">閉じる</button></div>`);
  }

  function startDeal(seed) {
    game = deal(seed);
    selected = null;
    hideSheet();
    save();
    render();
  }

  function tap(target) {
    if (!target || same(target, selected)) {
      selected = null;
    } else if (selected && canMove(game, selected, target)) {
      const from = selected;
      const hidden = from.col !== undefined && game.columns[from.col].length > runLength(game, from.col)
        && !game.columns[from.col][game.columns[from.col].length - 1 - runLength(game, from.col)][1];
      move(game, from, target);
      if (hidden) opened = from.col;
      selected = null;
      if (solved(game) && !game.scored) {
        game.scored = true;
        if (best === null || game.uses < best) best = game.uses;
      }
      save();
    } else {
      selected = topOf(game, target) !== null ? target : null;
    }
    render();
  }

  $("board").addEventListener("click", e => {
    const el = e.target.closest("[data-col]");
    tap(el ? { col: Number(el.dataset.col) } : null);
  });
  $("slots").addEventListener("click", e => {
    const el = e.target.closest("[data-slot]");
    tap(el ? { slot: Number(el.dataset.slot) } : null);
  });
  $("restart").addEventListener("click", () => startDeal(game.seed));
  $("fresh").addEventListener("click", () => startDeal(newSeed()));
  $("rules").addEventListener("click", showRules);
  $("sheet").addEventListener("click", e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (act === "fresh") startDeal(newSeed());
    if (act === "restart") startDeal(game.seed);
    if (act === "close") hideSheet();
  });

  function start(data) {
    const saved = data && data.game ? data : load();
    if (saved && saved.game) {
      game = saved.game;
      best = saved.best === undefined ? null : saved.best;
    } else {
      game = deal(newSeed());
    }
    fit();
    render();
    new ResizeObserver(() => { fit(); }).observe($("app"));
  }

  window.claude?.hot?.snapshot?.(() => ({ game, best }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
